name: Send newsletter

on:
  schedule:
  - cron: '27 9 * * 6' # Sambata la 9:27 UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  send-newsletter:
    # Disable on forks; require clear intent
    if: github.repository == 'RanGrosu/github-famous'
    runs-on: ubuntu-latest

    # Necesar pentru commit-ul de heartbeat de mai jos
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install deps
      run: npm ci

    - name: Copy .env file
      run: cp .env.example .env

    - name: Send newsletter
      run: npm run start
      env:
        RESEND_ENABLED: true
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        RESEND_FROM: ${{ vars.RESEND_FROM }}
        RESEND_TO: ${{ secrets.RESEND_TO }}
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}

    # GitHub dezactiveaza cron-urile in repo-urile fara activitate 60 de zile.
    # Un commit gol la fiecare rulare reseteaza contorul, deci cron-ul nu moare.
    # `always()` = se face si daca trimiterea a esuat, ca sa nu pierdem cron-ul.
    - name: Heartbeat (mentine cron-ul activ)
      if: always()
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit --allow-empty -m 'Heartbeat: rulare newsletter [skip ci]'
        git push
