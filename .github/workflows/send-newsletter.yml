name: Send newsletter

on:
  schedule:
  - cron: '27 9 * * 6' # Sambata la 9:27 UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  send-newsletter:
    # Disable on forks; require clear intent
    if: github.repository == 'RanGrosu/github-famous'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install deps
      run: npm ci

    - name: Copy .env file
      run: cp .env.example .env

    - name: Send newsletter
      run: npm run start
      env:
        RESEND_ENABLED: true
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        RESEND_FROM: ${{ vars.RESEND_FROM }}
        RESEND_TO: ${{ secrets.RESEND_TO }}
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
